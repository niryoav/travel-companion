name: Send travel reminders

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the Vercel reminder scheduler
        env:
          REMINDER_CRON_URL: ${{ secrets.REMINDER_CRON_URL }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${REMINDER_CRON_SECRET}" \
            "${REMINDER_CRON_URL}"
